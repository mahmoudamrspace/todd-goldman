  <defs>
    <style>
      .cls-1 {
        fill: #149248;
      }

      .cls-2 {
        fill: #bdbec0;
      }

      .cls-3 {
        fill: #91fb59;
      }

      .cls-4 {
        fill: #0076b6;
      }

      .cls-5 {
        fill: #ffcf06;
      }

      .cls-6 {
        fill: #f9a01b;
      }

      .cls-7 {
        fill: #7a2a90;
      }

      .cls-8 {
        fill: #ed202e;
      }

      .cls-9 {
        fill: #f2f2f3;
      }

      .cls-10 {
        fill: #f8b3c4;
      }

      .cls-11 {
        fill: #a7a9ac;
      }

      .cls-12 {
        fill: #f494be;
      }

      .cls-13 {
        fill: #7c4200;
      }

      .sketch-palette {
        fill: #f6d58f;
        stroke: #181818;
        stroke-width: 5px;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }

      @keyframes sketch-character-breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.002); }
      }

      @keyframes sketch-eye-blink {
        0%, 43%, 47%, 100% { transform: scaleY(1); }
        45% { transform: scaleY(0.08); }
      }

      @keyframes sketch-pencil-draw {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-1.2deg); }
        70% { transform: rotate(0.8deg); }
      }

      @keyframes sketch-dot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      .sketch-character {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: sketch-character-breathe 6s ease-in-out infinite;
      }

      .sketch-eye {
        transform-box: fill-box;
        transform-origin: center;
        animation: sketch-eye-blink 7.3s ease-in-out infinite;
      }

      .sketch-pencil {
        transform-box: fill-box;
        transform-origin: 12% 88%;
        animation: sketch-pencil-draw 2.8s ease-in-out infinite;
      }

      .sketch-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: sketch-dot-float 3.8s ease-in-out infinite;
      }

      .sketch-dot--2 { animation-delay: -0.9s; }
      .sketch-dot--3 { animation-delay: -1.8s; }
      .sketch-dot--4 { animation-delay: -2.7s; }
      .sketch-dot--5 { animation-delay: -1.35s; }

      @media (prefers-reduced-motion: reduce) {
        .sketch-character,
        .sketch-eye,
        .sketch-pencil,
        .sketch-dot {
          animation: none;
        }
      }
    </style>
  </defs>
