<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="131.59 124.74 1213.99 1409.36">
  <defs>
    <style>
      .cls-1 {
        fill: #f491a3;
      }

      .cls-2 {
        fill: #fef24a;
      }

      .cls-3 {
        fill: #fcbc3d;
      }

      @keyframes contact-sun-rays {
        0%, 100% { transform: rotate(-0.35deg) scale(1); }
        50% { transform: rotate(0.35deg) scale(1.006); }
      }

      @keyframes contact-sun-face {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.004); }
      }

      @keyframes contact-sun-blink {
        0%, 45%, 49%, 100% { transform: scaleY(1); }
        47% { transform: scaleY(0.08); }
      }

      .contact-sun-rays {
        transform-box: fill-box;
        transform-origin: 25% 44%;
        animation: contact-sun-rays 10s ease-in-out infinite;
      }

      .contact-sun-face {
        transform-box: fill-box;
        transform-origin: center;
        animation: contact-sun-face 7s ease-in-out infinite;
      }

      .contact-sun-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: contact-sun-blink 7.9s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .contact-sun-rays,
        .contact-sun-face,
        .contact-sun-eyes {
          animation: none;
        }
      }
    </style>
  </defs>
