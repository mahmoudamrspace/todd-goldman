<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="131.59 124.74 1213.99 1409.36">
  <defs>
    <style>
      .cls-1 {
        fill: #ffc60b;
      }

      .cls-2 {
        fill: #704c9f;
      }

      .cls-3 {
        fill: #69cef6;
      }

      .cls-4 {
        fill: #7b3500;
      }

      .cls-5 {
        fill: #6cbe4c;
      }

      .cls-6 {
        fill: #f38393;
      }

      @keyframes contact-bird-hover {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        30% { transform: translate(3px, -4px) rotate(-0.35deg); }
        55% { transform: translate(-1px, -7px) rotate(0.25deg); }
        80% { transform: translate(2px, -3px) rotate(-0.15deg); }
      }

      @keyframes contact-bird-wing {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        50% { transform: rotate(2deg) scaleY(0.97); }
      }

      #contact-bird {
        transform-box: fill-box;
        transform-origin: 50% 55%;
        animation: contact-bird-hover 5.4s ease-in-out infinite;
      }

      .contact-bird-wing {
        transform-box: fill-box;
        transform-origin: 84% 18%;
        animation: contact-bird-wing 0.32s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        #contact-bird,
        .contact-bird-wing {
          animation: none;
        }
      }
    </style>
  </defs>
