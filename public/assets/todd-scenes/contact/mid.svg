  <defs>
    <style>
      .cls-1 {
        fill: #d9a356;
      }

      .cls-2 {
        fill: #37a048;
      }

      .cls-3 {
        fill: #aa6e36;
      }

      .cls-4 {
        fill: #edbb6a;
      }

      .cls-5 {
        fill: #ad743f;
      }

      .cls-6 {
        fill: #c01823;
      }

      .cls-7 {
        fill: #f2f2f3;
      }

      .cls-8 {
        fill: #f082ab;
      }

      .cls-9 {
        fill: #ee2e26;
      }

      .cls-10 {
        fill: #040202;
      }

      .cls-11 {
        fill: #ac723c;
      }

      .cls-12 {
        fill: #ac7139;
      }

      .cls-13 {
        fill: #339746;
      }

      .cls-14 {
        fill: #aa6e35;
      }

      @keyframes contact-couple-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @keyframes contact-cake-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.003); }
      }

      @keyframes contact-cake-blink {
        0%, 46%, 50%, 100% { transform: scaleY(1); }
        48% { transform: scaleY(0.08); }
      }

      .contact-couple {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: contact-couple-breathe 5.8s ease-in-out infinite;
      }

      .contact-cake {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: contact-cake-float 4.8s ease-in-out infinite;
      }

      .contact-cake-eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: contact-cake-blink 6.7s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .contact-couple,
        .contact-cake,
        .contact-cake-eyes {
          animation: none;
        }
      }
    </style>
  </defs>
