      @keyframes faq-bee-hover {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        12% { transform: translate(4px, -6px) rotate(-1deg); }
        28% { transform: translate(8px, -12px) rotate(-2deg); }
        44% { transform: translate(2px, -15px) rotate(0.5deg); }
        58% { transform: translate(-5px, -11px) rotate(1.5deg); }
        72% { transform: translate(-2px, -6px) rotate(0.8deg); }
        86% { transform: translate(5px, -3px) rotate(-0.5deg); }
      }

      @keyframes faq-bee-wing-a {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(5deg) scale(0.95, 1.05); }
      }

      @keyframes faq-bee-wing-b {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(-4deg) scale(1.04, 0.96); }
      }

      @keyframes faq-flag-wind {
        0%, 100% { transform: rotate(0deg) skewX(0deg) translateX(0); }
        18% { transform: rotate(-3.5deg) skewX(-5deg) translateX(-1px); }
        36% { transform: rotate(1deg) skewX(2deg) translateX(0.5px); }
        54% { transform: rotate(-2deg) skewX(-3.5deg) translateX(-0.5px); }
        72% { transform: rotate(2.5deg) skewX(4deg) translateX(1px); }
        88% { transform: rotate(-1deg) skewX(-2deg) translateX(0); }
      }

      .faq-bee-hover {
        transform-box: fill-box;
        transform-origin: 55% 58%;
        animation: faq-bee-hover 4.2s ease-in-out infinite;
      }

      .faq-bee-wing-a {
        transform-box: fill-box;
        transform-origin: 68% 55%;
        animation: faq-bee-wing-a 0.14s ease-in-out infinite;
      }

      .faq-bee-wing-b {
        transform-box: fill-box;
        transform-origin: 62% 35%;
        animation: faq-bee-wing-b 0.14s ease-in-out infinite reverse;
      }

      .faq-flag-wind {
        transform-box: fill-box;
        transform-origin: 0% 18%;
        animation: faq-flag-wind 3.1s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .faq-bee-hover,
        .faq-bee-wing-a,
        .faq-bee-wing-b,
        .faq-flag-wind {
          animation: none;
        }
      }
